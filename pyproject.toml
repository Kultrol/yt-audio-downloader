[project]
name = "yt-audio-downloader"
version = "0.1.0"
description = "Turn YouTube concert videos into tagged local albums"
readme = "README.md"
authors = [
    { name = "kevin", email = "physicsKev@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mutagen>=1.48.1",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "typer>=0.27.1",
    "yt-dlp>=2026.7.4",
]

[project.scripts]
ytad = "yt_audio_downloader.cli:app"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
